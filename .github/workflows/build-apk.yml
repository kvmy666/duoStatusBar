name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --build-cache --console=plain

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk/debug -name '*.apk' -exec cp {} out/duo-statusbar-zh-debug.apk \;
          ls -la out/

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: duo-statusbar-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-latest"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" out/duo-statusbar-zh-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build (zh-rCN)" \
            --notes "Automated debug build with Simplified Chinese localization. Commit: $GITHUB_SHA" \
            --prerelease