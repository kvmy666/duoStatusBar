name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --build-cache --console=plain

      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --build-cache --console=plain
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duo-statusbar-apk
          path: out/*.apk
          if-no-files-found: error