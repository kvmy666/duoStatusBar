name: Build Release APK

on:
  push:
    tags:
      - '[0-9]*-*'   # VersionCode-VersionName, e.g. 1-0.1.0

permissions:
  contents: write

# One release job per ref; never cancel a publish midway (a half-uploaded
# release is worse than a queued one).
concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Measured job p95 253.4s; x1.5 = 380s. Eight minutes also covers a cold
    # Gradle/Robolectric cache, which the release runner has today.
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          # The publish steps authenticate with the GH_TOKEN env; no git
          # credential needs to persist in the checkout.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads this 190 MiB artefact at test runtime; it is not a
      # Gradle dependency and setup-gradle does not cache it. The exact key pins
      # the artifact coordinates so a Robolectric/SDK bump misses instead of
      # restoring a jar the new version will not use.
      - name: Cache Robolectric SDK 35 runtime jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-4.14.1-sdk35-android-all-instrumented-15-robolectric-12650502-i7-v1

      # Static gates mirroring ci.yml (non-network, no Gradle). They run before
      # anything is built so a broken invariant fails a release early.
      - name: Fast static gates
        run: |
          set -euo pipefail

          python3 tools/check-private-data.py
          python3 tools/route-module-logs.py --check

          python3 tools/check-rive-eases.py rive/duo/scene.rml
          python3 tools/check-rive-eases.py rive/duo/scene_old.rml

          # The selector is security-relevant: it decides which tests gate a PR.
          # Its built-in cases must pass before it can narrow anything.
          python3 tools/select-tests.py --selftest

          AUTHORITY='io.github.kvmy666.duostatusbar.settings'
          grep -q "$AUTHORITY" app/src/main/AndroidManifest.xml
          grep -q "$AUTHORITY" app/src/main/java/io/github/kvmy666/duostatusbar/settings/DuoPrefs.kt
          echo "authority present in both the manifest and DuoPrefs: $AUTHORITY"

          if grep -rn "IosRiveView" app/src/main; then
            echo "::error::IosRiveView must not exist in app/src/main; the Rive iOS renderer is retired"
            exit 1
          fi
          echo "IosRiveView absent from app/src/main"

      - name: Tag version must match the app version
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            *-*) VERSION="${TAG#*-}" ;;
            *)
              echo "::error::tag '$TAG' is not in VersionCode-VersionName form"
              exit 1
              ;;
          esac
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [ "$VERSION" != "$VERSION_NAME" ]; then
            echo "::error::tag version '$VERSION' does not match versionName '$VERSION_NAME'"
            exit 1
          fi
          echo "tag version matches versionName: $VERSION_NAME"

      - name: Release notes heading must match the tag version
        run: |
          VERSION="${GITHUB_REF_NAME#*-}"
          HEADING="$(head -n 1 RELEASE_NOTES.md)"
          case "$HEADING" in
            "# Duo Status Bar ${VERSION}"|"# Duo Status Bar ${VERSION} "*) ;;
            *)
              echo "::error::RELEASE_NOTES.md heading does not match tag version '$VERSION': $HEADING"
              exit 1
              ;;
          esac
          echo "release notes heading matches tag version: $VERSION"

      # The shipped .riv files were produced by 1.8.0. 1.9.2 tightened
      # interpolator validation and rejects the old scene; the scene now uses
      # hold on its 7 terminal keyframes. Caching an unsigned executable was
      # rejected, so the CLI always installs.
      - name: Install Rive CLI
        env:
          CI: '1'
          RIVE_ANALYTICS: 'off'
          RIVE_VERSION: '1.9.2'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libxkbcommon0 libwayland-client0 libx11-6
          curl -fsSL https://releases.rive.app/cli/install.sh | sh

      - name: Assert Rive CLI is exactly 1.9.2
        run: |
          set -euo pipefail
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.rive/bin/rive"
          VERSION="$("$HOME/.rive/bin/rive" --version 2>&1 | grep -oE '1\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ "$VERSION" != "1.9.2" ]; then
            echo "::error::expected Rive CLI 1.9.2, got '$VERSION'"
            exit 1
          fi
          echo "Rive CLI version: $VERSION"

      - name: Rive keyframes must carry the ease they ask for
        run: |
          set -euo pipefail
          python3 tools/check-rive-eases.py rive/duo/scene.rml
          python3 tools/check-rive-eases.py rive/duo/scene_old.rml
          python3 tools/check-rive-eases.py rive/ios/scene.rml

      - name: Both Duo Rive scenes must verify and match the shipped .riv files
        run: bash tools/check-rive-shipped.sh

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      # One Gradle invocation: tests and the release APK share configuration and
      # the build cache, instead of paying two configurations (measured p50 58s
      # tests + 107s release build).
      - name: Unit tests and release APK
        env:
          KEYSTORE_FILE: ../keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TELEGRAM_RELAY_KEY: ${{ secrets.TELEGRAM_RELAY_KEY }}
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest :app:assembleRelease --build-cache --console=plain

      - name: Version name from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#*-}"
          # alpha, beta and rc tags are pre-releases: they must not be marked Latest, and they must not
          # be promoted to the LSPosed store as the current stable build.
          VERSION_LOWER="$(printf '%s' "$VERSION_NAME" | tr '[:upper:]' '[:lower:]')"
          case "$VERSION_LOWER" in
            *alpha*|*beta*|*rc*) PRERELEASE=true ;;
            *) PRERELEASE=false ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Building ${VERSION_NAME} (prerelease=${PRERELEASE})"

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk DuoStatusBar-${{ steps.version.outputs.name }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.name }}
          files: DuoStatusBar-${{ steps.version.outputs.name }}.apk
          body_path: RELEASE_NOTES.md
          # alpha, beta and rc are pre-releases: never Latest, never promoted as stable below.
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.prerelease == 'false' }}

      - name: Publish to Xposed-Modules-Repo
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        # Stable releases only: a pre-release must never become the store's "Latest".
        if: env.GH_TOKEN != '' && steps.version.outputs.prerelease == 'false'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.name }}"
          APK_FILE="DuoStatusBar-${VERSION}.apk"
          REPO="Xposed-Modules-Repo/io.github.kvmy666.duostatusbar"

          if gh release view "${TAG}" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "${TAG}" "$APK_FILE" --repo "$REPO" --clobber
          else
            gh release create "${TAG}" "$APK_FILE" \
              --repo "$REPO" \
              --title "v${VERSION}" \
              --latest \
              --notes "Release v${VERSION}"
          fi

          # Force this release to be the mirror's "Latest": modules.lsposed.org keys the in-app store off
          # that pointer, and a stale one freezes the store at an old version.
          gh release edit "${TAG}" --repo "$REPO" --latest --draft=false --prerelease=false

          # The modules repo shows SUMMARY on its front page and README.md as the full description, so
          # keep both in sync with this repo (LSPosed's submission terms). Nothing else is uploaded:
          # the mirror gets the APK and the two meta files, never the source.
          for f in SUMMARY README.md; do
            content=$(base64 -w0 "$f")
            sha=$(gh api "repos/${REPO}/contents/${f}" --jq .sha 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api -X PUT "repos/${REPO}/contents/${f}" \
                -f message="Sync ${f} from source" -f content="$content" -f sha="$sha" > /dev/null
            else
              gh api -X PUT "repos/${REPO}/contents/${f}" \
                -f message="Add ${f}" -f content="$content" > /dev/null
            fi
          done
