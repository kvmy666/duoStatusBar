name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      # Every module log line has to go through L, never android.util.Log directly: OxygenOS drops the
      # latter from inside SystemUI, so a line written that way is invisible on the device that matters
      # (this is what made a working module look dead - see docs/evidence/phase3-log-sinks-and-fallback.md).
      - name: Module logs must go through L
        run: python3 tools/route-module-logs.py --check

      # The app preview and the status-bar module must draw the *same* file. The .riv is authored in
      # rive/duo and committed into the app, so this catches the failure mode where one of them is rebuilt
      # and the other is forgotten — which would show up as "the preview looks right, the phone does not".
      - name: The shipped .riv must be the built one
        run: |
          cmp rive/duo/build/duo.riv app/src/main/res/raw/duo.riv
          echo "rive/duo/build/duo.riv == app/src/main/res/raw/duo.riv"

      # The app↔module channel is addressed by an authority string that exists twice: as a manifest attribute
      # and as DuoPrefs.AUTHORITY. A unit test cannot compare them (Robolectric does not register manifest
      # providers), so CI does — a mismatch would silently disable the entire settings channel.
      - name: The provider authority must match the constant the module asks for
        run: |
          AUTHORITY='io.github.kvmy666.duostatusbar.settings'
          grep -q "$AUTHORITY" app/src/main/AndroidManifest.xml
          grep -q "$AUTHORITY" app/src/main/java/io/github/kvmy666/duostatusbar/settings/DuoPrefs.kt
          echo "authority present in both the manifest and DuoPrefs: $AUTHORITY"

      # Best effort: the compiled .riv is checked above, so a missing CLI never breaks the build.
      - name: Rive project checks
        run: |
          if command -v rive >/dev/null 2>&1; then
            RIVE="$(command -v rive)"
          elif [ -x "$HOME/.rive/bin/rive" ]; then
            RIVE="$HOME/.rive/bin/rive"
          else
            echo "::notice::Rive CLI unavailable on this runner - skipping rive/duo --verify"
            exit 0
          fi
          "$RIVE" rive/duo --verify
          "$RIVE" inspect rive/duo --summary
