name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit on the same ref supersedes an in-flight run: PR pushes are the
# norm here and the queue was the largest part of the measured wait (p95 39.8s).
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Measured job p95 196.3s; x1.5 = 294s. Six minutes keeps that budget and
    # leaves headroom for a cold Gradle start (47.5s config measured).
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads this 190 MiB artefact at test runtime; it is not a
      # Gradle dependency and setup-gradle does not cache it. The exact key pins
      # the artifact coordinates so a Robolectric/SDK bump misses instead of
      # restoring a jar the new version will not use.
      - name: Cache Robolectric SDK 35 runtime jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-4.14.1-sdk35-android-all-instrumented-15-robolectric-12650502-i7-v1

      # Fast checks that need no Gradle or network run first, so a broken gate
      # fails in seconds instead of after the full suite. Nothing here is new
      # coverage being removed from later steps; the Gradle job follows.
      - name: Fast static gates
        run: |
          set -euo pipefail

          python3 tools/check-private-data.py
          python3 tools/route-module-logs.py --check

          # `rive --verify` builds a keyframe that says `cubic` with no
          # CubicEaseInterpolator child without a word, and that keyframe does
          # not ease at all (`rive docs gotchas`). The whole file shipped that
          # way once — 27 cubic keyframes, zero curves.
          python3 tools/check-rive-eases.py rive/duo/scene.rml
          python3 tools/check-rive-eases.py rive/duo/scene_old.rml

          # The selector is security-relevant: it decides which tests gate a PR.
          # Its built-in cases must pass before it can narrow anything.
          python3 tools/select-tests.py --selftest

          # The app↔module channel is addressed by an authority string that
          # exists twice: as a manifest attribute and as DuoPrefs.AUTHORITY. A
          # unit test cannot compare them (Robolectric does not register
          # manifest providers), so CI does.
          AUTHORITY='io.github.kvmy666.duostatusbar.settings'
          grep -q "$AUTHORITY" app/src/main/AndroidManifest.xml
          grep -q "$AUTHORITY" app/src/main/java/io/github/kvmy666/duostatusbar/settings/DuoPrefs.kt
          echo "authority present in both the manifest and DuoPrefs: $AUTHORITY"

          # The Rive-based iOS bar owns the icons outright, so there must be no
          # IosRiveView left in the app sources (IosRiveAbsenceTest asserts the
          # same invariant from the test side).
          if grep -rn "IosRiveView" app/src/main; then
            echo "::error::IosRiveView must not exist in app/src/main; see IosRiveAbsenceTest"
            exit 1
          fi
          echo "IosRiveView absent from app/src/main"

      - name: Unit tests and debug build
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug --build-cache --console=plain

  # The Rive CLI install and scene verification used to sit on the build critical
  # path (24s measured). They are independent of Gradle, so run them in parallel
  # behind their own cache; the gates themselves are unchanged.
  rive:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Rive CLI 1.9.2
        id: rive-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.rive/bin/rive
            ~/.rive/versions/1.9.2/rive
          key: rive-1.9.2-linux-x64-v1

      # The published minimum is 1.9.2; 1.9.1 exits 8 before command dispatch.
      # Only the download/apt work is skipped on a hit (GL libs are not needed
      # for `--verify`, as documented by install.sh — UNVERIFIED on the runner).
      - name: Install Rive CLI
        if: steps.rive-cache.outputs.cache-hit != 'true'
        env:
          CI: '1'
          RIVE_ANALYTICS: 'off'
          RIVE_VERSION: '1.9.2'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1 libxkbcommon0 libwayland-client0 libx11-6
          curl -fsSL https://releases.rive.app/cli/install.sh | sh

      - name: Assert Rive CLI is exactly 1.9.2
        run: |
          set -euo pipefail
          echo "$HOME/.rive/bin" >> "$GITHUB_PATH"
          chmod +x "$HOME/.rive/bin/rive"
          VERSION="$("$HOME/.rive/bin/rive" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)"
          if [ "$VERSION" != "1.9.2" ]; then
            echo "::error::expected Rive CLI 1.9.2, got '$VERSION'"
            exit 1
          fi
          echo "Rive CLI version: $VERSION"

      - name: Rive keyframes must carry the ease they ask for
        run: |
          set -euo pipefail
          python3 tools/check-rive-eases.py rive/duo/scene.rml
          python3 tools/check-rive-eases.py rive/duo/scene_old.rml
          python3 tools/check-rive-eases.py rive/ios/scene.rml

      # The app preview and the status-bar module must draw the *same* file, for
      # both Duo scenes and the iOS scene. The .riv files are authored in rive/
      # and committed into the app, so this catches the failure mode where one
      # is rebuilt and the other is forgotten — which shows up as "the preview
      # looks right, the phone does not". Verifies offline and checks hashes.
      - name: Both Rive scenes must verify and match the shipped .riv files
        run: bash tools/check-rive-shipped.sh

  # Fast feedback only: the full `build` job above is the check to require in
  # branch protection (which is currently absent). This job narrows the unit
  # suite to the classes reachable from the PR diff and prints FULL whenever the
  # selector cannot prove its map; it never replaces the full-suite run.
  pr-selected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4
        with:
          # The selector diffs the merge base with three-dot syntax, so it needs
          # the PR history, not just the merge commit.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Robolectric SDK 35 runtime jar
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-4.14.1-sdk35-android-all-instrumented-15-robolectric-12650502-i7-v1

      - name: Select tests reachable from the diff
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # The PR merge checkout already contains HEAD; fetch BASE if shallow.
          git fetch --no-tags --depth=1 origin "$BASE" || true
          python3 tools/select-tests.py --base "$BASE" --head "$HEAD" --format gradle-args > /tmp/test-plan.txt
          cat /tmp/test-plan.txt

      - name: Run selected tests
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          if [ "$(cat /tmp/test-plan.txt)" = "FULL" ]; then
            ./gradlew :app:testDebugUnitTest --build-cache --console=plain
          else
            mapfile -t TESTS < /tmp/test-plan.txt
            ./gradlew :app:testDebugUnitTest --build-cache --console=plain "${TESTS[@]}"
          fi
