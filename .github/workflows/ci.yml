name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: No private evidence or private device data may be tracked
        run: python3 tools/check-private-data.py

      - name: Unit tests and debug build
        run: chmod +x ./gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain

      # Every module log line has to go through L, never android.util.Log directly: OxygenOS drops the
      # latter from inside SystemUI, so a line written that way is invisible on the device that matters
      # (this is what made a working module look dead; the phase-3 notes are in the private evidence archive).
      - name: Module logs must go through L
        run: python3 tools/route-module-logs.py --check

      # `rive --verify` builds a keyframe that says `cubic` with no CubicEaseInterpolator child without a
      # word, and that keyframe does not ease at all (`rive docs gotchas`). The whole file shipped that way
      # once — 27 cubic keyframes, zero curves — so the mistake is cheap to make and invisible without this.
      - name: Rive keyframes must carry the ease they ask for
        run: |
          python3 tools/check-rive-eases.py rive/duo/scene.rml
          python3 tools/check-rive-eases.py rive/duo/scene_old.rml

      # The app preview and the status-bar module must draw the *same* file, for both scenes. The .riv
      # files are authored in rive/duo and committed into the app, so this catches the failure mode where
      # one is rebuilt and the other is forgotten — which shows up as "the preview looks right, the phone
      # does not". This gate fails closed: a runner without the required Rive CLI fails instead of skipping.
      - name: Both Rive scenes must rebuild to the shipped .riv files
        run: bash tools/build-rive-both.sh

      # The app↔module channel is addressed by an authority string that exists twice: as a manifest attribute
      # and as DuoPrefs.AUTHORITY. A unit test cannot compare them (Robolectric does not register manifest
      # providers), so CI does — a mismatch would silently disable the entire settings channel.
      - name: The provider authority must match the constant the module asks for
        run: |
          AUTHORITY='io.github.kvmy666.duostatusbar.settings'
          grep -q "$AUTHORITY" app/src/main/AndroidManifest.xml
          grep -q "$AUTHORITY" app/src/main/java/io/github/kvmy666/duostatusbar/settings/DuoPrefs.kt
          echo "authority present in both the manifest and DuoPrefs: $AUTHORITY"
