name = "duo-log-relay"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Strongly-consistent rate limiting: one Durable Object instance per caller IP.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Caches the GitHub release list so one fetch per TTL serves every device (see GET /releases).
# Create it once and paste the printed id:
#   npx wrangler kv namespace create RELEASES
[[kv_namespaces]]
binding = "RELEASES"
id = "5fe692a0d2994354b57bcef67b98d310"

# Secrets are NOT here. Set them once (they are stored encrypted by Cloudflare):
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID       # owner's private chat (log ZIP only)
#   npx wrangler secret put TELEGRAM_GROUP_ID      # private/public ticket group
#   npx wrangler secret put TELEGRAM_GROUP_THREAD_ID # Open tickets topic
#   npx wrangler secret put TELEGRAM_CLOSED_THREAD_ID
#   npx wrangler secret put TELEGRAM_NOT_PLANNED_THREAD_ID
#   npx wrangler secret put OWNER_ID               # Telegram user allowed to change status
#   npx wrangler secret put SETUP_KEY              # one-time webhook setup key
#   npx wrangler secret put RELAY_KEY              # optional shared key
